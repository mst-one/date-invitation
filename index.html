<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デートのお誘い</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Yu Gothic",
    "Meiryo",
    sans-serif;
  color: #333;
}

body {
  background: linear-gradient(135deg, #fff7fb, #f5f7ff);
}

button,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 18px;
}

.card {
  width: min(100%, 620px);
  margin: auto;
  background: rgba(255, 255, 255, 0.96);
  border-radius: 24px;
  padding: 30px 20px;
  box-shadow: 0 15px 45px rgba(60, 60, 90, 0.12);
}

.hidden {
  display: none !important;
}

h1 {
  font-size: clamp(27px, 7vw, 40px);
  margin: 0 0 12px;
  text-align: center;
}

.lead {
  text-align: center;
  color: #777;
  margin: 0 0 28px;
}

.btn {
  border: 0;
  border-radius: 999px;
  padding: 14px 26px;
  font-weight: 700;
}

.primary {
  background: #ff6f9d;
  color: white;
}

.secondary {
  background: #eee;
  color: #555;
}

.actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

/* YES / NO */

.button-area {
  position: relative;
  height: 140px;
  max-width: 400px;
  margin: auto;
}

#yes {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-120%);
}

#no {
  position: absolute;
  left: 50%;
  top: 75px;
  transform: translateX(-50%);
}

.hint {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-top: 8px;
  min-height: 20px;
}

/* 見出し */

.section-title {
  font-size: 21px;
  text-align: center;
  margin: 0 0 8px;
}

.section-note {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin: 0 0 18px;
  line-height: 1.7;
}

/* カレンダー */

.calendar-wrap {
  background: #fafafa;
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 18px;
}

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.month-btn {
  width: 40px;
  height: 40px;
  border: 1px solid #eee;
  border-radius: 10px;
  background: white;
  font-size: 24px;
}

.weekdays,
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.weekdays span {
  text-align: center;
  font-size: 12px;
  color: #999;
  padding: 5px 0;
}

.day {
  aspect-ratio: 1;
  border: 1px solid #eee;
  border-radius: 9px;
  background: white;
  color: #444;
  padding: 0;
}

.day:disabled {
  color: #ccc;
  background: #f5f5f5;
  cursor: default;
}

.day.selected {
  background: #ff6f9d;
  color: white;
  border-color: #ff6f9d;
}

.day.empty {
  visibility: hidden;
}

/* 日付ごとの設定 */

.selected-list {
  margin: 14px 0;
}

.date-card {
  border: 1px solid #eee;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  background: white;
}

.date-card h3 {
  margin: 0 0 10px;
  font-size: 16px;
}

.rank-select {
  width: 100%;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
  margin-bottom: 10px;
}

.time-title {
  font-size: 13px;
  font-weight: 700;
  color: #666;
  margin-bottom: 8px;
}

.times {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.time {
  padding: 10px 4px;
  border: 1px solid #eee;
  border-radius: 9px;
  background: #fafafa;
  color: #555;
  font-size: 13px;
}

.time.selected {
  background: #ff6f9d;
  color: white;
  border-color: #ff6f9d;
}

.time.all-day {
  grid-column: 1 / -1;
  font-weight: 700;
}

/* エラー */

.error {
  color: #c44;
  text-align: center;
  font-size: 13px;
  min-height: 20px;
  margin: 10px 0;
}

/* 確認画面 */

.confirm-box {
  background: #fafafa;
  border-radius: 16px;
  padding: 16px;
  margin-top: 18px;
}

.confirm-item {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
  line-height: 1.7;
}

.confirm-item:last-child {
  border-bottom: 0;
}

.rank {
  font-weight: 700;
}

/* 完了 */

.complete {
  text-align: center;
}

.heart {
  font-size: 58px;
  margin-bottom: 5px;
}

.complete h2 {
  font-size: 29px;
  margin: 0 0 12px;
}

.complete p {
  color: #666;
  line-height: 1.8;
}

/* スマホ */

@media (max-width: 480px) {

  .screen {
    padding: 10px;
  }

  .card {
    padding: 25px 14px;
    border-radius: 20px;
  }

  .times {
    grid-template-columns: repeat(3, 1fr);
  }

  #yes {
    left: 50%;
    transform: translateX(-115%);
  }
}
</style>
</head>

<body>

<div class="screen">

<main class="card">

<!-- 最初の画面 -->

<section id="question">

  <h1>デートに行きませんか？</h1>

  <p class="lead">
    あなたの答えを選んでください。
  </p>

  <div class="button-area" id="buttonArea">

    <button
      class="btn primary"
      id="yes"
      type="button">
      YES
    </button>

    <button
      class="btn secondary"
      id="no"
      type="button">
      NO
    </button>

  </div>

  <div
    class="hint"
    id="hint">
    NOを選ぶこともできます。
  </div>

</section>


<!-- 日程選択 -->

<section
  id="schedule"
  class="hidden">

  <h2 class="section-title">
    都合のいい日を選んでください
  </h2>

  <p class="section-note">
    複数の日を選択できます。<br>
    選択した日ごとに希望時間と希望順位を設定できます。
  </p>


  <!-- カレンダー -->

  <div class="calendar-wrap">

    <div class="calendar-head">

      <button
        class="month-btn"
        id="prev"
        type="button">
        ‹
      </button>

      <strong id="monthTitle"></strong>

      <button
        class="month-btn"
        id="next"
        type="button">
        ›
      </button>

    </div>


    <div class="weekdays">

      <span>日</span>
      <span>月</span>
      <span>火</span>
      <span>水</span>
      <span>木</span>
      <span>金</span>
      <span>土</span>

    </div>


    <div
      class="calendar"
      id="calendar">
    </div>

  </div>


  <!-- 選択した日付 -->

  <div
    id="selectedCards"
    class="selected-list">
  </div>


  <div
    id="error"
    class="error">
  </div>


  <div class="actions">

    <button
      class="btn secondary"
      id="backQuestion"
      type="button">
      戻る
    </button>

    <button
      class="btn primary"
      id="review"
      type="button">
      確認する
    </button>

  </div>

</section>


<!-- 確認画面 -->

<section
  id="reviewSection"
  class="hidden">

  <h2 class="section-title">
    申請内容の確認
  </h2>

  <p class="section-note">
    この内容で申請します。
  </p>


  <div
    class="confirm-box"
    id="reviewList">
  </div>


  <div
    id="reviewError"
    class="error">
  </div>


  <div class="actions">

    <button
      class="btn secondary"
      id="edit"
      type="button">
      修正する
    </button>

    <button
      class="btn primary"
      id="submit"
      type="button">
      申請する
    </button>

  </div>

</section>


<!-- 完了画面 -->

<section
  id="complete"
  class="complete hidden">

  <div class="heart">
    ♡
  </div>

  <h2>
    デート申請完了！
  </h2>

  <p id="completeText"></p>

  <button
    class="btn secondary"
    id="restart"
    type="button">
    もう一度見る
  </button>

</section>

</main>

</div>


<!-- GAS送信用 -->

<iframe
  name="gasTarget"
  id="gasTarget"
  style="display:none">
</iframe>


<script>

(() => {

  /*
   * GASのウェブアプリURL
   */
  const API_URL =
    "https://script.google.com/macros/s/AKfycbzYWNafmabVaNa_VoZUufDfbT5RLaTKmnLT6OvJEsGsG_MAU_eYa2yMKrG1QA40Wmc/exec";


  /*
   * 招待URLのトークン
   *
   * URL:
   * ?invite=ここ
   */
  const inviteToken =
    new URLSearchParams(location.search).get("invite");


  /*
   * 招待URLがない場合
   */

  if (!inviteToken) {

    document.querySelector(".card").innerHTML =

      `
      <h1>招待URLが必要です</h1>

      <p class="lead">
        送られてきたURLからアクセスしてください。
      </p>
      `;

    return;
  }


  /*
   * 画面
   */

  const question =
    document.getElementById("question");

  const schedule =
    document.getElementById("schedule");

  const reviewSection =
    document.getElementById("reviewSection");

  const complete =
    document.getElementById("complete");

  const calendar =
    document.getElementById("calendar");

  const monthTitle =
    document.getElementById("monthTitle");

  const selectedCards =
    document.getElementById("selectedCards");

  const error =
    document.getElementById("error");


  /*
   * 表示中の月
   */

  let viewDate = new Date();

  viewDate.setDate(1);


  /*
   * 選択された日付
   *
   * {
   *   key: "2026-10-03",
   *   date: Date,
   *   times: [],
   *   rank: 1
   * }
   */

  let selectedDates = [];


  /*
   * NOボタン
   */

  const noMessages = [

    "えっ、そっちは選べませんよ？",

    "NOはちょっと待ってください！",

    "そのボタン、本当に押します？",

    "逃げちゃいました。",

    "まだYESを押すチャンスがあります。",

    "ここはひとつ、YESでお願いします。"

  ];


  function moveNo() {

    const area =
      document.getElementById("buttonArea");

    const no =
      document.getElementById("no");

    const yes =
      document.getElementById("yes");


    const areaRect =
      area.getBoundingClientRect();

    const noRect =
      no.getBoundingClientRect();

    const yesRect =
      yes.getBoundingClientRect();


    for (let i = 0; i < 30; i++) {

      const x =
        Math.random() *
        Math.max(
          0,
          areaRect.width - noRect.width
        );

      const y =
        Math.random() *
        Math.max(
          0,
          areaRect.height - noRect.height
        );


      const candidate = {

        left:
          areaRect.left + x,

        right:
          areaRect.left +
          x +
          noRect.width,

        top:
          areaRect.top + y,

        bottom:
          areaRect.top +
          y +
          noRect.height

      };


      const overlap =

        candidate.left <
          yesRect.right + 15 &&

        candidate.right >
          yesRect.left - 15 &&

        candidate.top <
          yesRect.bottom + 15 &&

        candidate.bottom >
          yesRect.top - 15;


      if (!overlap) {

        no.style.left =
          x + "px";

        no.style.top =
          y + "px";

        no.style.transform =
          "none";

        break;
      }

    }


    document.getElementById("hint")
      .textContent =
      noMessages[
        Math.floor(
          Math.random() *
          noMessages.length
        )
      ];

  }


  document
    .getElementById("no")
    .addEventListener(
      "mouseenter",
      moveNo
    );


  document
    .getElementById("no")
    .addEventListener(
      "touchstart",
      (e) => {

        e.preventDefault();

        moveNo();

      },
      {
        passive: false
      }
    );


  document
    .getElementById("no")
    .addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        moveNo();

      }
    );


  /*
   * YES
   */

  document
    .getElementById("yes")
    .onclick = () => {

      question.classList.add("hidden");

      schedule.classList.remove("hidden");

      renderCalendar();

      renderCards();

    };


  /*
   * 日付キー
   */

  function keyFor(date) {

    return (

      date.getFullYear() +

      "-" +

      String(
        date.getMonth() + 1
      ).padStart(2, "0") +

      "-" +

      String(
        date.getDate()
      ).padStart(2, "0")

    );

  }


  /*
   * 日付表示
   */

  function labelFor(item) {

    const week = [
      "日",
      "月",
      "火",
      "水",
      "木",
      "金",
      "土"
    ];


    return (

      item.date.getMonth() + 1 +

      "月" +

      item.date.getDate() +

      "日（" +

      week[item.date.getDay()] +

      "）"

    );

  }


  /*
   * カレンダー
   */

  function renderCalendar() {

    calendar.innerHTML = "";


    const year =
      viewDate.getFullYear();

    const month =
      viewDate.getMonth();


    monthTitle.textContent =

      year +
      "年" +
      (month + 1) +
      "月";


    const firstDay =
      new Date(
        year,
        month,
        1
      ).getDay();


    const daysInMonth =
      new Date(
        year,
        month + 1,
        0
      ).getDate();


    /*
     * 空白
     */

    for (
      let i = 0;
      i < firstDay;
      i++
    ) {

      const empty =
        document.createElement(
          "button"
        );

      empty.className =
        "day empty";

      empty.disabled = true;

      calendar.appendChild(empty);

    }


    /*
     * 今日
     */

    const today =
      new Date();

    today.setHours(
      0,
      0,
      0,
      0
    );


    /*
     * 日付
     */

    for (
      let day = 1;
      day <= daysInMonth;
      day++
    ) {

      const date =
        new Date(
          year,
          month,
          day
        );

      date.setHours(
        0,
        0,
        0,
        0
      );


      const key =
        keyFor(date);


      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";

      button.className =
        "day";

      button.textContent =
        day;


      /*
       * 過去の日付
       */

      if (date < today) {

        button.disabled =
          true;

      }


      /*
       * 選択済み
       */

      if (
        selectedDates.some(
          item =>
            item.key === key
        )
      ) {

        button.classList.add(
          "selected"
        );

      }


      /*
       * 日付クリック
       */

      button.onclick = () => {

        const index =
          selectedDates.findIndex(
            item =>
              item.key === key
          );


        if (index >= 0) {

          selectedDates.splice(
            index,
            1
          );

        } else {

          selectedDates.push({

            key: key,

            date: date,

            times: [],

            rank: null

          });

        }


        selectedDates.sort(
          (a, b) =>
            a.date - b.date
        );


        renderCalendar();

        renderCards();

      };


      calendar.appendChild(
        button
      );

    }


    /*
     * 前月ボタン
     */

    const currentMonth =
      new Date();

    currentMonth.setDate(1);

    currentMonth.setHours(
      0,
      0,
      0,
      0
    );


    document.getElementById(
      "prev"
    ).disabled =
      viewDate <= currentMonth;

  }


  /*
   * 前月
   */

  document
    .getElementById("prev")
    .onclick = () => {

      const currentMonth =
        new Date();

      currentMonth.setDate(1);

      currentMonth.setHours(
        0,
        0,
        0,
        0
      );


      if (
        viewDate >
        currentMonth
      ) {

        viewDate.setMonth(
          viewDate.getMonth() - 1
        );

        renderCalendar();

      }

    };


  /*
   * 次月
   */

  document
    .getElementById("next")
    .onclick = () => {

      viewDate.setMonth(
        viewDate.getMonth() + 1
      );

      renderCalendar();

    };


  /*
   * 日付ごとの設定画面
   */

  function renderCards() {

    selectedCards.innerHTML = "";


    if (
      selectedDates.length === 0
    ) {

      selectedCards.innerHTML =

        `
        <p class="section-note">
          まだ日付が選択されていません。
        </p>
        `;

      return;

    }


    selectedDates.forEach(
      (item) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "date-card";


        /*
         * 日付
         */

        const heading =
          document.createElement(
            "h3"
          );

        heading.textContent =
          labelFor(item);

        card.appendChild(
          heading
        );


        /*
         * 順位
         */

        const rank =
          document.createElement(
            "select"
          );

        rank.className =
          "rank-select";


        rank.innerHTML =

          `
          <option value="">
            希望順位を選択
          </option>

          <option value="1">
            第1希望
          </option>

          <option value="2">
            第2希望
          </option>

          <option value="3">
            第3希望
          </option>

          <option value="4">
            第4希望
          </option>

          <option value="5">
            第5希望
          </option>
          `;


        rank.value =
          item.rank || "";


        rank.onchange = () => {

          const value =
            rank.value
              ? Number(rank.value)
              : null;


          /*
           * 同じ順位があれば
           * 元の順位を解除
           */

          if (
            value !== null
          ) {

            selectedDates.forEach(
              (other) => {

                if (
                  other !== item &&
                  other.rank === value
                ) {

                  other.rank = null;

                }

              }
            );

          }


          item.rank =
            value;


          renderCards();

        };


        card.appendChild(
          rank
        );


        /*
         * 時間
         */

        const timeTitle =
          document.createElement(
            "div"
          );

        timeTitle.className =
          "time-title";

        timeTitle.textContent =
          "この日の希望時間（複数選択可）";

        card.appendChild(
          timeTitle
        );


        const times =
          document.createElement(
            "div"
          );

        times.className =
          "times";


        const options = [

          "終日",

          "06:00",
          "07:00",
          "08:00",
          "09:00",
          "10:00",
          "11:00",
          "12:00",
          "13:00",
          "14:00",
          "15:00",
          "16:00",
          "17:00",
          "18:00",
          "19:00",
          "20:00",
          "21:00",
          "22:00",
          "23:00",
          "24:00"

        ];


        options.forEach(
          (time) => {

            const button =
              document.createElement(
                "button"
              );


            button.type =
              "button";


            button.className =
              "time";


            if (
              time === "終日"
            ) {

              button.classList.add(
                "all-day"
              );

              button.textContent =
                "終日（1日空いている）";

            } else {

              button.textContent =
                time;

            }


            if (
              item.times.includes(
                time
              )
            ) {

              button.classList.add(
                "selected"
              );

            }


            button.onclick = () => {

              /*
               * 終日
               */

              if (
                time === "終日"
              ) {

                if (
                  item.times.includes(
                    "終日"
                  )
                ) {

                  item.times = [];

                } else {

                  item.times = [
                    "終日"
                  ];

                }

              }

              /*
               * 通常時間
               */

              else {

                item.times =
                  item.times.filter(
                    x =>
                      x !== "終日"
                  );


                if (
                  item.times.includes(
                    time
                  )
                ) {

                  item.times =
                    item.times.filter(
                      x =>
                        x !== time
                    );

                } else {

                  item.times.push(
                    time
                  );

                }


                item.times.sort();

              }


              renderCards();

            };


            times.appendChild(
              button
            );

          }
        );


        card.appendChild(
          times
        );


        selectedCards.appendChild(
          card
        );

      }
    );

  }


  /*
   * 入力チェック
   */

  function validate() {

    error.textContent = "";


    if (
      selectedDates.length === 0
    ) {

      error.textContent =
        "日付を1つ以上選択してください。";

      return false;

    }


    if (
      selectedDates.some(
        item =>
          item.times.length === 0
      )
    ) {

      error.textContent =
        "すべての日付に希望時間を選択してください。";

      return false;

    }


    if (
      selectedDates.some(
        item =>
          !item.rank
      )
    ) {

      error.textContent =
        "すべての日付に希望順位を設定してください。";

      return false;

    }


    const ranks =
      selectedDates.map(
        item =>
          item.rank
      );


    if (
      new Set(ranks).size !==
      ranks.length
    ) {

      error.textContent =
        "希望順位は重複しないようにしてください。";

      return false;

    }


    return true;

  }


  /*
   * 確認画面
   */

  document
    .getElementById("review")
    .onclick = () => {

      if (
        !validate()
      ) {

        return;

      }


      const sorted =
        [...selectedDates].sort(
          (a, b) =>
            a.rank - b.rank
        );


      document.getElementById(
        "reviewList"
      ).innerHTML =

        sorted.map(
          item =>

            `
            <div class="confirm-item">

              <span class="rank">
                第${item.rank}希望
              </span>

              <br>

              ${labelFor(item)}

              <br>

              希望時間：
              ${item.times.join("、")}

            </div>
            `

        ).join("");


      schedule.classList.add(
        "hidden"
      );

      reviewSection.classList.remove(
        "hidden"
      );

    };


  /*
   * 修正
   */

  document
    .getElementById("edit")
    .onclick = () => {

      reviewSection.classList.add(
        "hidden"
      );

      schedule.classList.remove(
        "hidden"
      );

    };


  /*
   * 最初に戻る
   */

  document
    .getElementById("backQuestion")
    .onclick = () => {

      schedule.classList.add(
        "hidden"
      );

      question.classList.remove(
        "hidden"
      );

    };


  /*
   * 申請送信
   */

  document
    .getElementById("submit")
    .onclick = () => {

      if (
        !validate()
      ) {

        return;

      }


      const sorted =
        [...selectedDates].sort(
          (a, b) =>
            a.rank - b.rank
        );


      /*
       * GASへ送るデータ
       */

      const answer =

        sorted.map(
          item => ({

            rank:
              item.rank,

            date:
              item.key,

            times:
              item.times

          })
        );


      /*
       * 通常のfetchではなく
       * HTMLフォームで送信します。
       */

      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        API_URL;


      form.target =
        "gasTarget";


      /*
       * トークン
       */

      const tokenInput =
        document.createElement(
          "input"
        );

      tokenInput.type =
        "hidden";

      tokenInput.name =
        "token";

      tokenInput.value =
        inviteToken;


      /*
       * 回答データ
       */

      const answerInput =
        document.createElement(
          "input"
        );

      answerInput.type =
        "hidden";

      answerInput.name =
        "answer";

      answerInput.value =
        JSON.stringify(answer);


      form.appendChild(
        tokenInput
      );

      form.appendChild(
        answerInput
      );


      document.body.appendChild(
        form
      );


      const submitButton =
        document.getElementById(
          "submit"
        );


      submitButton.disabled =
        true;

      submitButton.textContent =
        "送信中…";


      form.submit();


      /*
       * GASへの送信完了後、
       * 完了画面を表示
       */

      setTimeout(
        () => {

          reviewSection.classList.add(
            "hidden"
          );

          complete.classList.remove(
            "hidden"
          );


          document.getElementById(
            "completeText"
          ).innerHTML =

            `
            申請を受け付けました。<br>
            選択した日程を確認して、<br>
            調整させていただきます。
            `;

        },
        1200
      );

    };


  /*
   * もう一度見る
   */

  document
    .getElementById("restart")
    .onclick = () => {

      location.href =
        location.pathname +
        "?invite=" +
        encodeURIComponent(
          inviteToken
        );

    };


})();

</script>

</body>
</html>
